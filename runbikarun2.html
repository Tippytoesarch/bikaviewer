<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Bika Run! (Final)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: white;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: yellow;
            font-size: 2em;
            text-align: center;
            z-index: 100;
            transition: opacity 0.5s ease-out;
        }
        #loading-text {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        #loading-progress {
            margin-top: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 0, 0.3);
            border-top: 4px solid yellow;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">Loading Assets...</div>
        <div id="loading-progress">0%</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Core Game Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const loadingScreen = document.getElementById('loading-screen');
        const loadingProgress = document.getElementById('loading-progress');
        const loadingText = document.getElementById('loading-text');

        // --- Game Constants ---
        const GAME_CONSTANTS = {
            PLAYER_BASE_SPEED: 240,
            PLAYER_BOOST_SPEED: 480,
            PLAYER_WIDTH: 32,
            PLAYER_HEIGHT: 32,
            GHOST_WIDTH: 34,
            GHOST_HEIGHT: 34,
            BREAD_WIDTH: 28,
            BREAD_HEIGHT: 18,
            POWERUP_WIDTH: 30,
            POWERUP_HEIGHT: 30,
            JAIL_BAR_LONG_SIDE: 50,
            JAIL_BAR_SHORT_SIDE: 5,
            GAME_OVER_DURATION: 3.5,
            LEVEL_TRANSITION_DURATION: 10.0,
            SPEED_BOOST_DURATION: 5.0,
            BACKGROUND_FADE_DURATION: 1.5,
            SAFE_SPAWN_ATTEMPTS: 50,
            CANVAS_PADDING: 20,
            SCORE_TEXT_Y_OFFSET: 75,
        };

        // --- Game State Variables ---
        let score = 0;
        let scoreInCurrentLevel = 0;
        let level = 1;
        let bestSessionScore = 0;
        let entities = {
            player: null,
            ghosts: [],
            breads: [],
            powerups: [],
            jailBars: [],
        };
        let inputPos = { x: null, y: null, active: false };
        let currentLevelProps = {};
        let audioInitialized = false;

        // --- Asset Management ---
        const assetPaths = {
            player: 'https://tippytoesarch.github.io/bikaviewer/assets/player.png',
            cop: 'https://tippytoesarch.github.io/bikaviewer/assets/cop.png',
            bread: 'https://tippytoesarch.github.io/bikaviewer/assets/bread.png',
            powerup: 'https://tippytoesarch.github.io/bikaviewer/assets/powerup.png',
            qrImages: [
                'https://tippytoesarch.github.io/bikaviewer/assets/qr1.png', 'https://tippytoesarch.github.io/bikaviewer/assets/qr2.png',
                'https://tippytoesarch.github.io/bikaviewer/assets/qr3.png', 'https://tippytoesarch.github.io/bikaviewer/assets/qr4.png',
                'https://tippytoesarch.github.io/bikaviewer/assets/qr5.png', 'https://tippytoesarch.github.io/bikaviewer/assets/qr6.png',
                'https://tippytoesarch.github.io/bikaviewer/assets/qr7.png', 'https://tippytoesarch.github.io/bikaviewer/assets/qr8.png',
                'https://tippytoesarch.github.io/bikaviewer/assets/qr9.png', 'https://tippytoesarch.github.io/bikaviewer/assets/qr10.png'
            ],
            biteSound: 'https://tippytoesarch.github.io/bikaviewer/assets/bite.mp3',
            gameOverSound: 'https://tippytoesarch.github.io/bikaviewer/assets/game-over.mp3',
            powerupSound: 'https://tippytoesarch.github.io/bikaviewer/assets/power-up.mp3',
            levelUpSound: 'https://tippytoesarch.github.io/bikaviewer/assets/level-up.mp3'
        };
        const loadedAssets = {};
        const tintedAssetCache = {};

        // --- Level Properties ---
        const levelProperties = {
            1: { backgroundColor: '#003300', playerTint: 'white', ghostTint: 'white', breadTint: 'white', powerupTint: 'white', jailBarColor: 'gray', numGhosts: 3, ghostBaseSpeed: 90, numJailBars: 8, jailBarBaseSpeed: 1.0, breadSpawnInterval: 2.0, powerupSpawnInterval: 12.0, breadNeeded: 10, playerSafeRadius: 80, ghostActivationDelay: 0.0, ghostInitialSpeedFactor: 1.0, },
            2: { backgroundColor: '#202820', playerTint: 'rgb(255, 204, 204)', ghostTint: 'rgb(153, 128, 102)', breadTint: 'rgb(255, 178, 128)', powerupTint: 'rgb(204, 255, 204)', jailBarColor: '#404040', numGhosts: 4, ghostBaseSpeed: 120, numJailBars: 10, jailBarBaseSpeed: 1.2, breadSpawnInterval: 1.8, powerupSpawnInterval: 10.0, breadNeeded: 20, playerSafeRadius: 100, ghostActivationDelay: 0.5, ghostInitialSpeedFactor: 0.8, },
            3: { backgroundColor: '#4C2A85', playerTint: 'white', ghostTint: 'white', breadTint: 'white', powerupTint: 'white', jailBarColor: '#D3D3D3', numGhosts: 5, ghostBaseSpeed: 150, numJailBars: 12, jailBarBaseSpeed: 1.4, breadSpawnInterval: 1.5, powerupSpawnInterval: 8.0, breadNeeded: 30, playerSafeRadius: 120, ghostActivationDelay: 1.0, ghostInitialSpeedFactor: 0.6, }
        };

        // --- Utility Functions ---
        const utils = {
            parseColorToRGB(colorStr) {
                if (colorStr.startsWith('rgb')) {
                    const match = colorStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
                    return match ? [parseInt(match[1]), parseInt(match[2]), parseInt(match[3])] : [0, 0, 0];
                } else if (colorStr.startsWith('#')) {
                    const hex = colorStr.slice(1);
                    return hex.length === 3 ? [parseInt(hex[0]+hex[0],16), parseInt(hex[1]+hex[1],16), parseInt(hex[2]+hex[2],16)] : [parseInt(hex.substring(0,2),16), parseInt(hex.substring(2,4),16), parseInt(hex.substring(4,6),16)];
                }
                return [0, 0, 0];
            },
            rgbArrayToColorString(rgb) { return `rgb(${Math.round(rgb[0])}, ${Math.round(rgb[1])}, ${Math.round(rgb[2])})`; },
            checkCollision(rect1, rect2) {
                return (rect1.x - rect1.width / 2 < rect2.x + rect2.width / 2 && rect1.x + rect1.width / 2 > rect2.x - rect2.width / 2 && rect1.y - rect1.height / 2 < rect2.y + rect2.height / 2 && rect1.y + rect1.height / 2 > rect2.y - rect2.height / 2);
            },
            playSound(soundKey) {
                if (!audioInitialized) return;
                const audio = loadedAssets[soundKey];
                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.warn(`Sound playback failed for ${soundKey}:`, e));
                }
            }
        };

        // --- Entity Classes ---
        class Entity {
            constructor(x, y, width, height, color) {
                Object.assign(this, { x, y, width, height, color, flipX: false });
            }
            draw(ctx, image, tintColor) {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.flipX) ctx.scale(-1, 1);

                if (!tintColor || tintColor === 'white' || !image.src) {
                    ctx.drawImage(image, -this.width / 2, -this.height / 2, this.width, this.height);
                } else {
                    const cacheKey = image.src + '_' + tintColor;
                    let tintedImage = tintedAssetCache[cacheKey];

                    if (!tintedImage) {
                        const offscreenCanvas = document.createElement('canvas');
                        const offscreenCtx = offscreenCanvas.getContext('2d');
                        offscreenCanvas.width = image.width;
                        offscreenCanvas.height = image.height;
                        offscreenCtx.drawImage(image, 0, 0);
                        const imageData = offscreenCtx.getImageData(0, 0, image.width, image.height);
                        const data = imageData.data;
                        const tintRgb = utils.parseColorToRGB(tintColor);

                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
                            if (a > 0) {
                                data[i] = (r / 255) * tintRgb[0];
                                data[i + 1] = (g / 255) * tintRgb[1];
                                data[i + 2] = (b / 255) * tintRgb[2];
                            }
                        }
                        offscreenCtx.putImageData(imageData, 0, 0);
                        tintedAssetCache[cacheKey] = offscreenCanvas;
                        tintedImage = offscreenCanvas;
                    }
                    ctx.drawImage(tintedImage, -this.width / 2, -this.height / 2, this.width, this.height);
                }
                ctx.restore();
            }
        }

        class Player extends Entity {
            constructor(x, y) {
                super(x, y, GAME_CONSTANTS.PLAYER_WIDTH, GAME_CONSTANTS.PLAYER_HEIGHT, 'white');
                this.speed = GAME_CONSTANTS.PLAYER_BASE_SPEED;
                this.speedBoostTimer = 0;
            }
            update(dt) {
                if (this.speedBoostTimer > 0) {
                    this.speedBoostTimer -= dt;
                    if (this.speedBoostTimer <= 0) this.speed = GAME_CONSTANTS.PLAYER_BASE_SPEED;
                }
                if (inputPos.active) {
                    const dx = inputPos.x - this.x;
                    const dy = inputPos.y - this.y;
                    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                        const angle = Math.atan2(dy, dx);
                        let potentialX = this.x + Math.cos(angle) * this.speed * dt;
                        let potentialY = this.y + Math.sin(angle) * this.speed * dt;
                        
                        // NEW: Flip the sprite based on movement direction
                        this.flipX = dx < 0;

                        const originalX = this.x, originalY = this.y;
                        this.x = potentialX;
                        if (entities.jailBars.some(bar => utils.checkCollision(this, bar))) this.x = originalX;
                        this.y = potentialY;
                        if (entities.jailBars.some(bar => utils.checkCollision(this, bar))) this.y = originalY;
                    }
                }
                const pad = GAME_CONSTANTS.CANVAS_PADDING;
                this.x = Math.max(pad + this.width / 2, Math.min(this.x, canvas.width - pad - this.width / 2));
                this.y = Math.max(pad + this.height / 2, Math.min(this.y, canvas.height - pad - this.height / 2));
            }
            draw(ctx) {
                super.draw(ctx, loadedAssets.player, currentLevelProps.playerTint);
            }
            activateSpeedBoost() {
                this.speed = GAME_CONSTANTS.PLAYER_BOOST_SPEED;
                this.speedBoostTimer = GAME_CONSTANTS.SPEED_BOOST_DURATION;
                utils.playSound('powerupSound');
            }
        }

        class Ghost extends Entity {
            constructor(x, y, speed, color) {
                super(x, y, GAME_CONSTANTS.GHOST_WIDTH, GAME_CONSTANTS.GHOST_HEIGHT, color);
                Object.assign(this, {
                    baseSpeed: speed,
                    isActive: false,
                    activationDelay: currentLevelProps.ghostActivationDelay,
                    initialSpeedFactor: currentLevelProps.ghostInitialSpeedFactor,
                    levelStartTime: 0
                });
            }
            update(dt, player, levelTimer) {
                this.levelStartTime = levelTimer;
                if (!this.isActive && this.levelStartTime >= this.activationDelay) {
                    this.isActive = true;
                }
                if (!this.isActive || !player) return;

                const rampUpDuration = 3.0;
                const timeSinceActive = this.levelStartTime - this.activationDelay;
                const speedFactor = Math.min(1.0, this.initialSpeedFactor + (1.0 - this.initialSpeedFactor) * (timeSinceActive / rampUpDuration));
                const currentSpeed = this.baseSpeed * speedFactor;

                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 1) {
                    this.x += (dx / dist) * currentSpeed * dt;
                    this.y += (dy / dist) * currentSpeed * dt;
                }
                
                // NEW: Flip the sprite based on movement direction
                this.flipX = dx < 0;
            }
            draw(ctx) {
                super.draw(ctx, loadedAssets.cop, currentLevelProps.ghostTint);
            }
        }

        class JailBar extends Entity {
            constructor(x, y, width, height, color, xVel, yVel) {
                super(x, y, width, height, color);
                Object.assign(this, { xVel, yVel });
            }
            update(dt) {
                this.x += this.xVel * dt;
                this.y += this.yVel * dt;
                const pad = 30;
                if (this.x - this.width/2 < pad || this.x + this.width/2 > canvas.width - pad) this.xVel *= -1;
                if (this.y - this.height/2 < pad || this.y + this.height/2 > canvas.height - pad) this.yVel *= -1;
            }
            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height);
            }
        }

        class Collectible extends Entity {
            constructor(x, y, width, height, color) {
                super(x, y, width, height, color);
            }
        }

        class Bread extends Collectible {
            constructor(x, y, color) {
                super(x, y, GAME_CONSTANTS.BREAD_WIDTH, GAME_CONSTANTS.BREAD_HEIGHT, color);
            }
            draw(ctx) {
                super.draw(ctx, loadedAssets.bread, currentLevelProps.breadTint);
            }
        }

        class Powerup extends Collectible {
            constructor(x, y, color) {
                super(x, y, GAME_CONSTANTS.POWERUP_WIDTH, GAME_CONSTANTS.POWERUP_HEIGHT, color);
            }
            draw(ctx) {
                super.draw(ctx, loadedAssets.powerup, currentLevelProps.powerupTint);
            }
        }

        // --- Finite State Machine (FSM) ---
        let currentState;
        const gameStates = {
            LOADING: {
                enter() {
                    const allPaths = Object.entries(assetPaths).flatMap(([key, value]) => key === 'qrImages' ? value.map(p => [p, p]) : [[key, value]]);
                    const totalAssets = allPaths.length;
                    let loadedCount = 0;

                    const promises = allPaths.map(([key, path]) => new Promise((resolve) => {
                        const handleSuccess = (asset) => {
                            loadedAssets[key] = asset;
                            loadedCount++;
                            const progress = Math.floor((loadedCount / totalAssets) * 100);
                            loadingProgress.textContent = `${progress}%`;
                            loadingText.textContent = `Loading Assets (${loadedCount}/${totalAssets})...`;
                            resolve();
                        };
                        const handleError = (e) => {
                            console.warn(`Failed to load: ${path}`, e);
                            loadedCount++;
                            resolve();
                        };

                        if (path.endsWith('.png')) {
                            const img = new Image();
                            img.src = path;
                            img.onload = () => handleSuccess(img);
                            img.onerror = handleError;
                        } else if (path.endsWith('.mp3')) {
                            const audio = new Audio();
                            audio.src = path;
                            const timeoutId = setTimeout(() => {
                                console.warn(`Audio timed out: ${path}. Continuing...`);
                                handleSuccess(null);
                            }, 3000);
                            audio.oncanplaythrough = () => { clearTimeout(timeoutId); handleSuccess(audio); };
                            audio.onerror = (e) => { clearTimeout(timeoutId); handleError(e); };
                        }
                    }));

                    Promise.all(promises).then(() => {
                        setTimeout(() => {
                            loadingScreen.style.opacity = '0';
                            loadingScreen.addEventListener('transitionend', () => loadingScreen.style.display = 'none', { once: true });
                            changeState('TITLE');
                        }, 250);
                    });
                }
            },
            TITLE: {
                enter() {
                    resizeCanvas();
                    Object.values(entities).forEach(e => Array.isArray(e) ? e.length = 0 : e = null);
                    entities.player = null;
                    canvas.style.backgroundColor = levelProperties[1].backgroundColor;
                },
                update() {
                    if (inputPos.active) {
                        changeState('PLAYING');
                        inputPos.active = false;
                    }
                },
                draw() {
                    const blinkAlpha = 0.6 + Math.sin(performance.now() / 400) * 0.4;
                    drawText('Run Bika Run!', canvas.width / 2, canvas.height / 2 - 80, '8vw Avenir Next', 'yellow');
                    drawText('Tap to Start', canvas.width / 2, canvas.height / 2 + 20, '4vw Avenir Next', 'yellow', 'center', blinkAlpha);
                    drawText(`Session Best: ${bestSessionScore}`, canvas.width / 2, canvas.height / 2 + 80, '3vw Avenir Next', 'gold');
                }
            },
            PLAYING: {
                timers: { levelStart: 0, breadSpawn: 0, powerupSpawn: 0, },
                enter() {
                    if (level === 1) score = 0;
                    this.timers.levelStart = 0;
                    this.timers.breadSpawn = 0;
                    this.timers.powerupSpawn = 0;
                    loadLevel(level);
                },
                update(dt) {
                    this.timers.levelStart += dt;
                    this.timers.breadSpawn += dt;
                    this.timers.powerupSpawn += dt;
                    
                    entities.player?.update(dt);
                    entities.ghosts.forEach(g => g.update(dt, entities.player, this.timers.levelStart));
                    entities.jailBars.forEach(b => b.update(dt));

                    if (this.timers.breadSpawn > currentLevelProps.breadSpawnInterval) {
                        spawnBread();
                        this.timers.breadSpawn = 0;
                    }
                    if (this.timers.powerupSpawn > currentLevelProps.powerupSpawnInterval) {
                        spawnPowerup();
                        this.timers.powerupSpawn = 0;
                    }

                    if (entities.player) {
                        if (entities.ghosts.some(g => g.isActive && utils.checkCollision(entities.player, g))) {
                            utils.playSound('gameOverSound');
                            changeState('GAME_OVER');
                            return;
                        }
                        entities.breads = entities.breads.filter(bread => {
                            if (utils.checkCollision(entities.player, bread)) {
                                score++;
                                scoreInCurrentLevel++;
                                utils.playSound('biteSound');
                                return false;
                            }
                            return true;
                        });
                        entities.powerups = entities.powerups.filter(powerup => {
                            if (utils.checkCollision(entities.player, powerup)) {
                                entities.player.activateSpeedBoost();
                                return false;
                            }
                            return true;
                        });
                    }

                    if (scoreInCurrentLevel >= currentLevelProps.breadNeeded) {
                        utils.playSound('levelUpSound');
                        changeState('LEVEL_TRANSITION');
                    }
                },
                draw() {
                    entities.jailBars.forEach(b => b.draw(ctx));
                    entities.breads.forEach(b => b.draw(ctx));
                    entities.powerups.forEach(p => p.draw(ctx));
                    entities.ghosts.forEach(g => g.draw(ctx));
                    entities.player?.draw(ctx);
                    drawText(`Burek: ${scoreInCurrentLevel}/${currentLevelProps.breadNeeded}  |  Level: ${level}  |  Total: ${score}`,
                        canvas.width / 2, canvas.height - GAME_CONSTANTS.SCORE_TEXT_Y_OFFSET, '20px Avenir Next', 'white');
                }
            },
            LEVEL_TRANSITION: {
                timer: 0, startColor: [], endColor: [], qrImage: null,
                enter() {
                    this.timer = 0;
                    level++;
                    const nextLevelProps = getDynamicLevelProps(level);
                    this.startColor = utils.parseColorToRGB(canvas.style.backgroundColor);
                    this.endColor = utils.parseColorToRGB(nextLevelProps.backgroundColor);
                    this.qrImage = loadedAssets[assetPaths.qrImages[Math.floor(Math.random() * assetPaths.qrImages.length)]];
                    entities.ghosts = []; entities.breads = []; entities.powerups = []; entities.jailBars = [];
                },
                update(dt) {
                    this.timer += dt;
                    const t = Math.min(1, this.timer / GAME_CONSTANTS.BACKGROUND_FADE_DURATION);
                    const r = this.startColor[0] + (this.endColor[0] - this.startColor[0]) * t;
                    const g = this.startColor[1] + (this.endColor[1] - this.startColor[1]) * t;
                    const b = this.startColor[2] + (this.endColor[2] - this.startColor[2]) * t;
                    canvas.style.backgroundColor = utils.rgbArrayToColorString([r, g, b]);
                    if (this.timer >= GAME_CONSTANTS.LEVEL_TRANSITION_DURATION) {
                        changeState('PLAYING');
                    }
                },
                draw() {
                    entities.player?.draw(ctx);
                    const countdown = Math.ceil(GAME_CONSTANTS.LEVEL_TRANSITION_DURATION - this.timer);
                    drawText(`Level ${level-1} Complete!`, canvas.width / 2, canvas.height * 0.2, '40px Avenir Next', 'lime');
                    drawText('Scan QR for Bonus!', canvas.width / 2, canvas.height * 0.28, '30px Avenir Next', 'yellow');
                    if (this.qrImage) {
                        const qrSize = Math.min(canvas.width * 0.5, canvas.height * 0.4);
                        ctx.drawImage(this.qrImage, canvas.width/2 - qrSize/2, canvas.height/2 - qrSize/2, qrSize, qrSize);
                    }
                    drawText(`Next Level in: ${countdown}`, canvas.width / 2, canvas.height * 0.8, '30px Avenir Next', 'yellow');
                }
            },
            GAME_OVER: {
                timer: 0,
                enter() {
                    this.timer = 0;
                    if (score > bestSessionScore) bestSessionScore = score;
                    entities.player = null;
                },
                update(dt) {
                    this.timer += dt;
                    if (this.timer > GAME_CONSTANTS.GAME_OVER_DURATION || inputPos.active) {
                        level = 1;
                        changeState('TITLE');
                        inputPos.active = false;
                    }
                },
                draw() {
                    entities.ghosts.forEach(g => g.draw(ctx));
                    const flashAlpha = Math.max(0, 0.7 - (this.timer / 1.5));
                    ctx.fillStyle = `rgba(255, 0, 0, ${flashAlpha})`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    const blinkAlpha = 0.6 + Math.sin(performance.now() / 250) * 0.4;
                    drawText('ARRESTED!', canvas.width / 2, canvas.height / 2 - 50, '54px Avenir Next', 'red', 'center', blinkAlpha);
                    drawText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20, '36px Avenir Next', 'white');
                    drawText(`Level Reached: ${level}`, canvas.width / 2, canvas.height / 2 + 60, '36px Avenir Next', 'white');
                    if(this.timer > 1.0) {
                        drawText('Tap to Restart', canvas.width / 2, canvas.height - 50, '25px Avenir Next', 'yellow');
                    }
                }
            }
        };

        function changeState(newState) {
            currentState = gameStates[newState];
            currentState.enter?.();
        }

        // --- Game Logic & Spawning ---
        function loadLevel(levelNumber) {
            scoreInCurrentLevel = 0;
            currentLevelProps = getDynamicLevelProps(levelNumber);
            canvas.style.backgroundColor = currentLevelProps.backgroundColor;
            
            entities.ghosts = []; entities.breads = []; entities.powerups = []; entities.jailBars = [];

            if (!entities.player) {
                entities.player = new Player(canvas.width / 2, canvas.height / 2);
            } else {
                entities.player.x = canvas.width / 2;
                entities.player.y = canvas.height / 2;
                entities.player.speed = GAME_CONSTANTS.PLAYER_BASE_SPEED;
            }

            const safeZone = { x: entities.player.x, y: entities.player.y, width: currentLevelProps.playerSafeRadius * 2, height: currentLevelProps.playerSafeRadius * 2 };
            
            for (let i = 0; i < currentLevelProps.numJailBars; i++) spawnJailBar(safeZone);
            for (let i = 0; i < currentLevelProps.numGhosts; i++) spawnGhost(safeZone);

            for (let i = 0; i < currentLevelProps.breadNeeded; i++) {
                const newBread = new Bread(0, 0, currentLevelProps.breadTint);
                if (spawnInSafeLocation(newBread, safeZone, ...entities.ghosts, ...entities.breads, ...entities.powerups, ...entities.jailBars)) {
                    entities.breads.push(newBread);
                }
            }
        }

        function getDynamicLevelProps(levelNum) {
            if (levelProperties[levelNum]) return levelProperties[levelNum];
            const base = levelProperties[3];
            const diff = levelNum - 3;
            return {
                backgroundColor: `rgb(${Math.floor(Math.random()*50)}, ${Math.floor(Math.random()*50)}, ${Math.floor(Math.random()*50 + 20)})`,
                playerTint: `rgb(${Math.floor(Math.random() * 50 + 205)}, ${Math.floor(Math.random() * 50 + 205)}, ${Math.floor(Math.random() * 50 + 205)})`,
                ghostTint: `rgb(${Math.floor(Math.random() * 100 + 50)}, ${Math.floor(Math.random() * 100 + 50)}, ${Math.floor(Math.random() * 100 + 50)})`,
                breadTint: `rgb(255, ${Math.floor(Math.random() * 100 + 100)}, ${Math.floor(Math.random() * 50)})`,
                powerupTint: `rgb(${Math.floor(Math.random() * 100)}, 255, ${Math.floor(Math.random() * 100)})`,
                jailBarColor: 'gray',
                numGhosts: Math.min(15, base.numGhosts + diff),
                ghostBaseSpeed: base.ghostBaseSpeed + diff * 15,
                numJailBars: Math.min(25, base.numJailBars + diff * 2),
                jailBarBaseSpeed: base.jailBarBaseSpeed + diff * 0.1,
                breadSpawnInterval: Math.max(0.5, base.breadSpawnInterval - diff * 0.1),
                powerupSpawnInterval: Math.max(4.0, base.powerupSpawnInterval - diff * 0.5),
                breadNeeded: base.breadNeeded + diff * 5,
                playerSafeRadius: base.playerSafeRadius + diff * 5,
                ghostActivationDelay: base.ghostActivationDelay,
                ghostInitialSpeedFactor: base.ghostInitialSpeedFactor,
            };
        }
        
        function spawnInSafeLocation(newEntity, ...safeZones) {
            for (let i = 0; i < GAME_CONSTANTS.SAFE_SPAWN_ATTEMPTS; i++) {
                newEntity.x = Math.random() * (canvas.width - 80) + 40;
                newEntity.y = Math.random() * (canvas.height - 80) + 40;
                if (!safeZones.some(zone => utils.checkCollision(newEntity, zone))) return true;
            }
            console.warn("Could not find safe spawn position for entity.");
            return false;
        }

        function spawnGhost(playerSafeZone) {
            const newGhost = new Ghost(0, 0, currentLevelProps.ghostBaseSpeed, currentLevelProps.ghostTint);
            if (spawnInSafeLocation(newGhost, playerSafeZone, ...entities.jailBars)) {
                entities.ghosts.push(newGhost);
            }
        }
        
        function spawnJailBar(playerSafeZone) {
            const isHorizontal = Math.random() > 0.5;
            const width = isHorizontal ? GAME_CONSTANTS.JAIL_BAR_LONG_SIDE : GAME_CONSTANTS.JAIL_BAR_SHORT_SIDE;
            const height = isHorizontal ? GAME_CONSTANTS.JAIL_BAR_SHORT_SIDE : GAME_CONSTANTS.JAIL_BAR_LONG_SIDE;
            const speed = (Math.random() * 50 + 25) * currentLevelProps.jailBarBaseSpeed;
            const angle = Math.random() * Math.PI * 2;
            const newBar = new JailBar(0, 0, width, height, currentLevelProps.jailBarColor, Math.cos(angle) * speed, Math.sin(angle) * speed);
            
            for (let i = 0; i < GAME_CONSTANTS.SAFE_SPAWN_ATTEMPTS; i++) {
                newBar.x = Math.random() * (canvas.width - 80) + 40;
                newBar.y = Math.random() * (canvas.height - 80) + 40;
                if (!utils.checkCollision(newBar, playerSafeZone)) {
                    entities.jailBars.push(newBar);
                    return;
                }
            }
        }
        
        function spawnBread() {
            const newBread = new Bread(0, 0, currentLevelProps.breadTint);
            if (spawnInSafeLocation(newBread, ...entities.ghosts, ...entities.breads, ...entities.powerups, ...entities.jailBars)) {
                entities.breads.push(newBread);
            }
        }

        function spawnPowerup() {
            const newPowerup = new Powerup(0, 0, currentLevelProps.powerupTint);
            if (spawnInSafeLocation(newPowerup, ...entities.ghosts, ...entities.breads, ...entities.powerups, ...entities.jailBars)) {
                entities.powerups.push(newPowerup);
            }
        }

        // --- Canvas & Rendering ---
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (currentState && currentState.draw) {
                clearCanvas();
                currentState.draw();
            }
        }

        function drawText(text, x, y, font, color, align = 'center', alpha = 1.0) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = font;
            ctx.fillStyle = color;
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function clearCanvas() {
            ctx.fillStyle = canvas.style.backgroundColor || '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // --- Main Game Loop ---
        let lastTime = 0;
        function gameLoop(timestamp) {
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if (currentState) {
                clearCanvas();
                currentState.update?.(dt);
                currentState.draw?.();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        function initAudio() {
            if (audioInitialized) return;
            Object.values(loadedAssets).forEach(asset => {
                if (asset instanceof HTMLAudioElement) {
                    asset.play();
                    asset.pause();
                    asset.currentTime = 0;
                }
            });
            audioInitialized = true;
            console.log("Audio unlocked.");
        }

        // --- Event Listeners & Initialization ---
        window.addEventListener('resize', resizeCanvas);
        
        window.addEventListener('pointerdown', (e) => {
            initAudio();
            const rect = canvas.getBoundingClientRect();
            inputPos.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            inputPos.y = (e.clientY - rect.top) * (canvas.height / rect.height);
            inputPos.active = true;
        });

        window.addEventListener('pointerup', () => {
            inputPos.active = false;
        });

        window.addEventListener('pointermove', (e) => {
            const rect = canvas.getBoundingClientRect();
            inputPos.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            inputPos.y = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        // Initialize the game
        changeState('LOADING');
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
